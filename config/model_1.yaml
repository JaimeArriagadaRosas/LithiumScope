schema_version: 1

model:
  algorithms:
    - random_forest
    - xgboost
    - svm
    - tabnet
    - hist_gradient_boosting
    - catboost

data:
  target_candidates:
    - Li_icpms
  quality_column_candidates:
    - "SUM (no water)"
    - "SUM(no water)"
    - "SUM (water)"
  quality_min: 94.0
  quality_max: 102.0
  target_lower_quantile: 0.025
  target_upper_quantile: 0.975
  age_max_missing_fraction: 0.50

validation:
  outer_folds: 5
  inner_folds: 5
  random_seed: 42
  prefer_spatial_groups: true
  spatial_group_degrees: 0.5

optimization:
  enabled: true
  n_trials: 20
  per_algorithm_trials:
    tabnet: 8
    catboost: 12
  pruning:
    enabled: true
    startup_trials: 4
    warmup_folds: 2

competition:
  primary_metric: rmse
  tie_breakers:
    - mae
    - r2
  winner_rule: lowest_mean_outer_cv_rmse

baseline:
  enabled: true
  strategy: mean
