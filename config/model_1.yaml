schema_version: 1

model:
  algorithms:
    - random_forest
    - xgboost
    - svm
    - tabnet
    - hist_gradient_boosting
    - catboost

data_sources:
  base:
    key: mamani09_public_mirror
  georoc:
    enabled: true
    input_glob: data/raw/model_1/georoc/*.csv
    harmonized_path: data/interim/model_1/georoc_harmonized.csv
    combined_path: data/processed/model_1/training_combined.csv
    frozen_combined_sha256: 94e78b2662b002184bcfd550be0aacc522f5eec73283d0c12f75be29599bcc94
    audit_path: data/processed/model_1/source_merge_audit.json
    chunksize: 100000
    allowed_material_types:
      - WHOLE ROCK
    minimum_predictors: 8
    # vNext: FeOT (total Fe as FeO) -> Fe2O3 total equivalent; QC unchanged.
    # Rollback: set to original. No GEOROC raw source is rewritten.
    iron_total_mode: feot_equivalent

data:
  preparation_version: 2
  # Versioned candidate contract; serialized releases retain their fitted transforms.
  preprocessing_policy: stable_v1
  target_candidates:
    - Li_icpms
  quality_column_candidates:
    - "SUM (no water)"
    - "SUM(no water)"
    - "SUM (water)"
  quality_min: 94.0
  quality_max: 102.0
  # Diagnostic quantiles only; target values are not trimmed before CV.
  target_lower_quantile: 0.025
  target_upper_quantile: 0.975
  # Age coverage is descriptive; the feature contract is fixed before CV.
  include_age: false
  age_max_missing_fraction: 0.50
  # Preserve zero pending source-specific semantic audit.
  target_zero_policy: retain

validation:
  outer_folds: 5
  inner_folds: 5
  random_seed: 42
  prefer_spatial_groups: true
  allow_random_fallback: false
  spatial_group_degrees: 0.5

optimization:
  enabled: true
  # Joint inner-CV search of hyperparameters and predeclared data treatments.
  treatment_search_profile: refinement_v1
  n_trials: 20
  per_algorithm_trials:
    tabnet: 8
    catboost: 12
  pruning:
    enabled: true
    startup_trials: 4
    warmup_folds: 2

competition:
  # One candidate per family; target treatments are selected only in inner CV.
  # The outer evaluation remains development evidence (folds were previously observed).
  target_transforms:
    identity: all
  primary_metric: rmse
  tie_breakers:
    - mae
    - r2
  winner_rule: lowest_mean_outer_cv_rmse
  # Conservative research policy fixed before evaluation; not geological tolerances.
  # Relative to paired TRAIN-only mean/median references; no promotion without holdout.
  development_gate:
    max_worst_fold_rmse_ratio: 1.0
    min_fold_win_fraction: 0.6
    max_high_mae_ratio: 1.0
    max_high_abs_bias_ratio: 1.0
    max_source_abs_bias_ratio: 1.0

baseline:
  enabled: true
  strategies: [mean, median]
  minimum_rmse_gain_ppm: 0.0

robustness:
  # Synthetic stress scenarios, not measurement uncertainty or release gate.
  physical_scenarios_enabled: true
