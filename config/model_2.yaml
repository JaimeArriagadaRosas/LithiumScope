schema_version: 1

model:
  algorithms:
    - random_forest
    - extra_trees
    - hist_gradient_boosting
    - xgboost
    - catboost
    - svm_rbf
  target_mode: high_lithium_quantile
  high_lithium_quantile: 0.75
  fixed_threshold_ppm: null
  random_seed: 42

imagery:
  provider: earth_search
  stac_url: https://earth-search.aws.element84.com/v1
  collection: sentinel-2-l2a
  datetime: 2020-01-01/..
  cloud_cover_max: 35
  search_limit: 20
  request_timeout_seconds: 60
  max_retries: 3
  scene_cache_decimals: 4
  max_consecutive_sample_failures: 10
  checkpoint_every: 10
  progress_every: 25
  patch_size_m: 640
  patch_pixels: 32
  bands:
    - red
    - green
    - blue
    - nir
    - swir16
    - swir22
  accepted_extensions:
    - .tif
    - .tiff
    - .npy
  normalize_per_band: false
  nodata_fill: median

training:
  manifest_path: data/processed/model_2/training_manifest.csv
  partial_manifest_path: data/processed/model_2/training_manifest.partial.csv
  failures_path: data/processed/model_2/training_failures.csv
  feature_cache_path: data/processed/model_2/sentinel_features.csv
  # Frozen manifest avoids re-provisioning M2 from the expanded M1 dataset.
  frozen_expected_rows: 706
  frozen_manifest_sha256: 5c42e8b5fac697d6c1a579ef760ad642d736da14fa4e7d605596b7f4813498e1
  # Expands ONLY model 2. Legacy 706-row training and M1 B are read-only.
  expansion:
    enabled: true
    source_audit_path: results/scientific_simulations/vnext_20261106/georoc_source_validation/georoc_B_screened_sites.csv
    state_dir: data/interim/model_2/vnext_georoc
    patch_dir: data/raw/model_2/vnext_georoc/patches
    output_manifest_path: data/processed/model_2/vnext_expanded/training_manifest.csv
    feature_cache_path: data/processed/model_2/vnext_expanded/spectral_features.csv
    target_new_samples: 80
    minimum_new_samples: 40
    max_per_publication: 10
    max_li_ppm: 100.6
    max_scene_cloud_percent: 25
    max_patch_cloud_fraction: 0.25
    max_consecutive_failures: 18
  image_cache_dir: data/raw/model_2/sentinel2/patches
  sample_id_column: sample_id
  lithium_column: Li_icpms
  spatial_group_column: spatial_group
  spatial_group_degrees: 0.5
  minimum_samples: 50

validation:
  folds: 5
  inner_folds: 3
  prefer_spatial_groups: true
  # Preserve all 706 historical test indices/labels while adding new groups.
  anchor_legacy:
    enabled: true
    folds_file: config/model_2_frozen_spatial_folds_706.json
    folds_sha256: de48ea656c26b9e44a0ebab46c7a1a507ef16eee6ec70e5784329144ccc2a2bd

quality_training:
  enabled: true
  minimum_joint_valid_fraction: 0.95
  inventory_path: results/scientific_simulations/sentinel_methodology_20261112/inventory/local_patch_inventory_783.csv
  policy: train_only_preserve_all_outer_test

optimization:
  enabled: true
  # Versioned spatial-overfit experiment. Keeps legacy Optuna studies intact.
  # This setting participates in build_training_signature via model_2.yaml.
  random_forest_search_profile: regularized_v3
  extra_trees_search_profile: regularized_v2
  # Optional experimental spatial sigmoid for ALL algorithms; do not enable
  # until nested TRAIN-only threshold checks show recall is retained.
  # Real-data smoke: sigmoid with fixed 0.5 produced zero VP in fold 1.
  calibration_policy: legacy
  n_trials: 12
  per_algorithm_trials:
    random_forest: 16
    extra_trees: 12
    catboost: 10
    hist_gradient_boosting: 10
    svm_rbf: 10
  pruning:
    enabled: true
    startup_trials: 3
    warmup_folds: 2

decision_threshold:
  objective: balanced_accuracy
  fallback: 0.50

competition:
  primary_metric: roc_auc
  tie_breakers:
    - average_precision
    - balanced_accuracy
  winner_rule: highest_cross_validated_roc_auc

release_gate:
  min_roc_auc_gain_over_baseline: 0.02
  min_average_precision_gain_over_baseline: 0.02

baseline:
  enabled: true
  strategy: prior
