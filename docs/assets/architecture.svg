<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><style>.title{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 18px Arial,sans-serif;fill:#111827}.t{font:14px Arial,sans-serif;fill:#374151}.shared{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:16}.m1{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}.m2{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:16}.line{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><text x="600" y="45" text-anchor="middle" class="title">LithiumScope — Arquitectura modular</text><rect x="390" y="75" width="420" height="90" class="shared"/><text x="600" y="112" text-anchor="middle" class="h">main.py + CLI</text><text x="600" y="138" text-anchor="middle" class="t">Entrenar · Predecir · Métricas</text><rect x="55" y="225" width="490" height="250" class="m1"/><text x="300" y="260" text-anchor="middle" class="h">Modelo 1 — Predicción de Li</text><text x="85" y="300" class="t">• Datos geoquímicos, geológicos y geoespaciales</text><text x="85" y="330" class="t">• Limpieza de límites de detección</text><text x="85" y="360" class="t">• Filtro Li + control SUM(no water)</text><text x="85" y="390" class="t">• Variables derivadas + one-hot</text><text x="85" y="420" class="t">• RF / XGBoost / SVM / TabNet</text><text x="85" y="450" class="t">Salida: Li_icpms estimado (ppm)</text><rect x="655" y="225" width="490" height="250" class="m2"/><text x="900" y="260" text-anchor="middle" class="h">Modelo 2 — Prospectividad espacial</text><text x="685" y="300" class="t">• Parches multibanda / hiperespectrales</text><text x="685" y="330" class="t">• Pares muestra ↔ imagen ↔ Li conocido</text><text x="685" y="360" class="t">• Preprocesamiento por bandas</text><text x="685" y="390" class="t">• Características espectrales</text><text x="685" y="420" class="t">• Clasificador de prioridad exploratoria</text><text x="685" y="450" class="t">Salida: score de prospectividad / prioridad</text><rect x="190" y="535" width="820" height="80" class="shared"/><text x="600" y="568" text-anchor="middle" class="h">Infraestructura compartida</text><text x="600" y="594" text-anchor="middle" class="t">Datasets · logs centralizados · CPU/GPU · persistencia · configuración · file picker</text><line x1="600" y1="165" x2="300" y2="225" class="line"/><line x1="600" y1="165" x2="900" y2="225" class="line"/><line x1="300" y1="475" x2="430" y2="535" class="line"/><line x1="900" y1="475" x2="770" y2="535" class="line"/></svg>