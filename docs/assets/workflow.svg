<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><defs><style>.title{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 16px Arial,sans-serif;fill:#111827}.t{font:13px Arial,sans-serif;fill:#374151}.b{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.line{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="600" y="42" text-anchor="middle" class="title">Flujo de ejecución local</text><rect x="35" y="115" width="170" height="100" class="b"/><text x="120" y="153" text-anchor="middle" class="h">1. Menú</text><text x="120" y="178" text-anchor="middle" class="t">python main.py</text><rect x="255" y="115" width="170" height="100" class="b"/><text x="340" y="153" text-anchor="middle" class="h">2. Datos</text><text x="340" y="178" text-anchor="middle" class="t">auto-download / picker</text><rect x="475" y="115" width="170" height="100" class="b"/><text x="560" y="153" text-anchor="middle" class="h">3. Pipeline</text><text x="560" y="178" text-anchor="middle" class="t">steps/*.py</text><rect x="695" y="115" width="170" height="100" class="b"/><text x="780" y="153" text-anchor="middle" class="h">4. Entrenamiento</text><text x="780" y="178" text-anchor="middle" class="t">CPU / GPU</text><rect x="915" y="115" width="250" height="100" class="b"/><text x="1040" y="153" text-anchor="middle" class="h">5. Persistencia</text><text x="1040" y="178" text-anchor="middle" class="t">modelo + metadata + métricas</text><line x1="205" y1="165" x2="255" y2="165" class="line"/><line x1="425" y1="165" x2="475" y2="165" class="line"/><line x1="645" y1="165" x2="695" y2="165" class="line"/><line x1="865" y1="165" x2="915" y2="165" class="line"/><rect x="255" y="330" width="690" height="100" class="b"/><text x="600" y="366" text-anchor="middle" class="h">Predicción posterior</text><text x="600" y="392" text-anchor="middle" class="t">Explorador de archivos → validación → modelo guardado → resultado local</text><line x1="1040" y1="215" x2="1040" y2="270" class="line"/><line x1="1040" y1="270" x2="600" y2="330" class="line"/></svg>