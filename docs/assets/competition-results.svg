<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><style>.title{font:700 28px Arial,sans-serif;fill:#111827}.h{font:700 17px Arial,sans-serif;fill:#111827}.t{font:14px Arial,sans-serif;fill:#374151}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:15}.win{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:15}.res{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:15}.line{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="600" y="42" text-anchor="middle" class="title">Competencia y centro de resultados</text><rect x="45" y="100" width="210" height="120" class="box"/><text x="150" y="137" text-anchor="middle" class="h">Dataset común</text><text x="150" y="165" text-anchor="middle" class="t">steps + auditoría</text><text x="150" y="190" text-anchor="middle" class="t">tablas + gráficos</text><rect x="310" y="82" width="260" height="156" class="box"/><text x="440" y="117" text-anchor="middle" class="h">6 algoritmos</text><text x="440" y="145" text-anchor="middle" class="t">entrenamiento secuencial</text><text x="440" y="170" text-anchor="middle" class="t">validación por folds</text><text x="440" y="195" text-anchor="middle" class="t">métricas independientes</text><rect x="625" y="100" width="220" height="120" class="box"/><text x="735" y="137" text-anchor="middle" class="h">Ranking</text><text x="735" y="165" text-anchor="middle" class="t">métrica principal</text><text x="735" y="190" text-anchor="middle" class="t">+ desempates</text><rect x="900" y="100" width="250" height="120" class="win"/><text x="1025" y="137" text-anchor="middle" class="h">Modelo ganador</text><text x="1025" y="165" text-anchor="middle" class="t">fit final</text><text x="1025" y="190" text-anchor="middle" class="t">persistencia + metadata</text><line x1="255" y1="160" x2="310" y2="160" class="line"/><line x1="570" y1="160" x2="625" y2="160" class="line"/><line x1="845" y1="160" x2="900" y2="160" class="line"/><rect x="160" y="340" width="880" height="180" class="res"/><text x="600" y="378" text-anchor="middle" class="h">results/&lt;modelo&gt;/runs/&lt;timestamp&gt;/</text><text x="250" y="423" class="t">• figures/ — distribuciones, competencia, residuos, ROC/PR</text><text x="250" y="453" class="t">• tables/ — folds, predicciones OOF, correlaciones, auditoría</text><text x="250" y="483" class="t">• exports/ — libro Excel + referencia del ganador</text><text x="250" y="513" class="t">• dashboard.html — previsualización local de toda la ejecución</text><line x1="1025" y1="220" x2="820" y2="340" class="line"/></svg>