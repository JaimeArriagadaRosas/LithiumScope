name: Reporte de error
description: Reportar un problema reproducible del software
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Descripción
      description: Comportamiento observado y resultado esperado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Incluye menú, inputs sintéticos, entorno y versión/commit; no adjuntes datos restringidos
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y contexto
      description: Logs sanitizados, trazas, versiones Python y limitaciones
